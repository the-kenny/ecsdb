[package]
name = "ecsdb_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ecsdb = { path = "../ecsdb" }
nom = "8.0.0"
rustyline = { version = "18.0.1" }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = "1.49.0"

[[bin]]
name = "ecsdb"
path = "src/bin/ecsdb.rs"
doc = false
