[package]
name = "ecsdb"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
anymap = "0.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
ecsdb_derive = { path = "../ecsdb_derive" }
rusqlite = { version = "0.40.2", features = ["modern_sqlite", "functions"] }
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
insta = "1.49.0"

[lints.clippy]
needless_lifetimes = "allow"
